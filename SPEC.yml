# Spec-Driven Orchestra — Single Source of Truth (SSOT)
#
# This file is the ONE place where the package's invariant facts live.
# Documents must not contradict it. The sync-check gate (R7) verifies that
# every document agrees with these values. Change a fact here, then run
# sync-check to find every document that needs updating.
#
# Why this exists: facts copy-pasted across 12 documents drift over time
# (we hit exactly this with instrument counts and star numbers). One source
# + an enforced check makes drift impossible to merge.

framework:
  name: SDD
  full_name: Spec-Driven Development
  role: The single framework (conductor). Owns the 7-step flow and enforcement gates.
  source: https://github.com/github/spec-kit
  license: MIT

# The framework calls these skills. They are NOT equal peers to SDD.
skills:
  - id: karpathy-enforcer
    instrument: 1st Violin
    emoji: "🎻"
    role: Code quality — enforce the 4 principles
    called_during: Implement
    source: https://github.com/multica-ai/andrej-karpathy-skills
    license: MIT
    maturity: established
    external_plugin: false

  - id: grill-me
    instrument: Piano
    emoji: "🎹"
    role: Clarification — remove ambiguity on demand
    called_during: Any step
    source: https://github.com/mattpocock/skills
    license: MIT
    maturity: established
    external_plugin: false

  - id: verification-design
    instrument: Percussion
    emoji: "🥁"
    role: Verification criteria (5 categories)
    called_during: Verify
    source: Community methodology
    license: none
    maturity: generic-practice
    external_plugin: false

  - id: handoff-writer
    instrument: Brass
    emoji: "🎺"
    role: Work handover
    called_during: Handoff
    source: https://github.com/mattpocock/skills
    license: MIT
    maturity: established
    external_plugin: false

  - id: harness
    instrument: Guitar
    emoji: "🎸"
    role: Agent-team & skill architect for large tasks
    called_during: Tasks
    source: https://github.com/revfactory/harness
    license: Apache-2.0
    maturity: widely-adopted
    external_plugin: true        # NOT generated by this package; installed separately
    experimental_dependency: "CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1"

counts:
  skills: 5            # number of skills the framework calls
  instruments_total: 6 # SDD + 5 skills (the "orchestra")
  sdd_steps: 7         # Specify, Clarify, Plan, Tasks, Verify, Implement, Handoff

# The 7-step flow (canonical order and emoji owner)
flow:
  - { step: 0,  name: Survey,    emoji: "🎼", conditional: existing-code-only }
  - { step: 1,  name: Specify,   emoji: "🎼" }
  - { step: 2,  name: Clarify,   emoji: "🎹" }
  - { step: 3,  name: Plan,      emoji: "🎼" }
  - { step: 4,  name: Tasks,     emoji: "🎼" }
  - { step: 5,  name: Verify,    emoji: "🥁" }
  - { step: 6,  name: Implement, emoji: "🎻" }
  - { step: 7,  name: Handoff,   emoji: "🎺" }

# Enforcement rules (the gates read these; docs must describe them consistently)
rules:
  R1: No code without a spec (01-spec.md)
  R2: No code without a plan (03-plan.md)
  R3: No commit without passing verification
  R4: Preserve existing behavior (regression) when existing code is touched
  R5: No silent handoff gaps (warning)
  R6: Production strictness — R3/R4 mandatory and non-bypassable
  R7: Document synchronization — all docs must agree with this SSOT

enforcement_levels:
  - standard   # R1-R5; R3/R4 bypassable once with logged override
  - strict     # R1-R6; no bypass (auto when production signals detected)

# Design invariants (claims every document must keep consistent)
invariants:
  modes: none                 # no GREENFIELD/EARLY/REBUILD
  hierarchy: sdd-conducts-skills
  universal_application: true # new, early, legacy, maintenance, production
  legacy_priority: false      # universal, but legacy is NOT prioritized
  status: experimental        # combined effect not yet measured
  control_model: enforced     # gates, not advice

# Bilingual contract
languages:
  default: en                 # no suffix
  korean_suffix_root: ".ko.md"    # root README uses dot
  korean_suffix_symphony: ".ko.md" # symphony files use dot

# Star counts are intentionally NOT stored here.
# They change over time; documents must use qualitative maturity (above)
# and tell readers to check each repo. sync-check FORBIDS hardcoded star numbers.
